[package]
name = "pulseram"
version = "2.0.0"
edition = "2021"
rust-version = "1.92"
description = "Intelligent memory optimizer and process governor for Windows 10 & 11"
license = "MIT"
repository = "https://github.com/Hiirocchi18/PulseRAM"
publish = false
build = "build.rs"

[[bin]]
name = "PulseRAM"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "raw-window-handle-06",
] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# Development preview only (PulseRAM ships for Windows): lets the UI run on a Linux desktop with fake data.
slint = { version = "1.18", default-features = false, features = ["backend-winit-x11"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.dev]
opt-level = 1
