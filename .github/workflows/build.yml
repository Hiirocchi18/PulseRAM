name: Build installer

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:
  # Called by release.yml when a release is published (signs the files when SignPath is set up).
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read   # lets the SignPath action read this run's artifacts

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run tests
        run: dotnet test tests/PulseRAM.Tests/PulseRAM.Tests.csproj --logger "console;verbosity=normal"

  build:
    name: Build ${{ matrix.arch }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-latest
            suffix: ""
          - arch: arm64
            platform: ARM64
            runner: windows-11-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PUBLISH: publish_${{ matrix.arch }}
      # Code signing runs only for releases, and only once SignPath is configured (see docs/SIGNING.md).
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content PulseRAM.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "PulseRAM version $v ($env:PROCESSOR_ARCHITECTURE runner)"

      - name: Publish self-contained (with WinUI resources)
        shell: pwsh
        run: |
          # The PRI (WinUI resource) tasks ship with Visual Studio, not the dotnet CLI.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath
          Write-Host "Visual Studio: $vs"
          $msbuild = @("MSBuild\Current\Bin\arm64\MSBuild.exe", "MSBuild\Current\Bin\amd64\MSBuild.exe", "MSBuild\Current\Bin\MSBuild.exe") |
            ForEach-Object { Join-Path $vs $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "MSBuild: $msbuild"
          $out = Join-Path $PWD "$env:PUBLISH\"
          & $msbuild PulseRAM.csproj -restore -t:Publish -v:minimal -nologo "-flp:logfile=msbuild.log;verbosity=normal" `
            -p:Configuration=Release "-p:Platform=${{ matrix.platform }}" "-p:RuntimeIdentifier=win-${{ matrix.arch }}" -p:SelfContained=true `
            "-p:PublishDir=$out" `
            -p:EnableCoreMrtTooling=true -p:AppxGeneratePriEnabled=true -p:IncludeProjectPriFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item PulseRAM.ico $env:PUBLISH -Force
          Get-ChildItem $env:PUBLISH -Filter *.pdb -Recurse | Remove-Item -Force

      - name: Verify files and report size
        shell: pwsh
        run: |
          $dir = $env:PUBLISH
          $missing = @()
          foreach ($f in @("PulseRAM.exe", "PulseRAM.dll", "resources.pri", "Microsoft.UI.Xaml.Controls.pri", "pulseram_defaults.json")) {
            if (-not (Test-Path (Join-Path $dir $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) { Write-Error "Missing from publish output: $($missing -join ', ')"; exit 1 }
          $files = Get-ChildItem $dir -Recurse -File
          "Publish output: {0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          "== Largest files =="
          $files | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object { "{0,8:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1) }
          "== Sub-folders =="
          Get-ChildItem $dir -Directory | ForEach-Object {
            $s = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            "{0,8:N2} MB  {1}\" -f ($s / 1MB), $_.Name
          }

      - name: Smoke test (full view, compact view, screenshots)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "$env:PUBLISH\PulseRAM.exe"
          $data = Join-Path $env:LOCALAPPDATA "PulseRAM"
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          $cfg = Join-Path $data "pulseram_config.json"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($path) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "Screenshot failed: $_" }
          }
          function Assert-Running($p, $what) {
            $p.Refresh()
            if ($p.HasExited) {
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } |
                Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
              $l = Get-ChildItem (Join-Path $data "logs") -Filter "pulseram-*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($l) { "== PulseRAM log =="; Get-Content $l.FullName -Tail 60 }
              Write-Error "PulseRAM exited during $what (exit code $($p.ExitCode))."
              exit 1
            }
          }
          New-Item -ItemType Directory -Force screenshots | Out-Null

          # 1) First run: full view with the welcome card.
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          Assert-Running $p "first start"
          if (-not (Test-Path $cfg)) { Write-Error "PulseRAM did not write $cfg"; exit 1 }
          Save-Screen "screenshots\welcome.png"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2

          # 2) Second run: no welcome card. Runs > 30 s so the scheduled update check happens, and switches
          #    Windows to dark mode while running to exercise the live theme change.
          #    (The welcome card from run 1 was never answered, so mark it answered.)
          (Get-Content $cfg -Raw) -replace '"WelcomeShown":\s*false', '"WelcomeShown": true' | Set-Content $cfg -Encoding utf8
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          Assert-Running $p "second start"
          Save-Screen "screenshots\full.png"
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          $oldLight = (Get-ItemProperty $personalize -Name AppsUseLightTheme -ErrorAction SilentlyContinue).AppsUseLightTheme
          if ($null -eq $oldLight) { $oldLight = 1 }
          Add-Type -Namespace Win32 -Name Msg -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr SendMessageTimeout(IntPtr hWnd, uint Msg, IntPtr wParam, string lParam, uint flags, uint timeout, out IntPtr result);
          [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string name);
          '@
          function Set-AppTheme([int]$light) {
            New-ItemProperty $personalize -Name AppsUseLightTheme -Value $light -PropertyType DWord -Force | Out-Null
            $r = [IntPtr]::Zero
            [Win32.Msg]::SendMessageTimeout([IntPtr]0xffff, 0x001A, [IntPtr]::Zero, "ImmersiveColorSet", 2, 5000, [ref]$r) | Out-Null
          }
          Set-AppTheme ([int](1 - [int]$oldLight))
          Start-Sleep -Seconds 8
          Assert-Running $p "live theme switch"
          Save-Screen "screenshots\full-theme-switched.png"
          Set-AppTheme ([int]$oldLight)
          Start-Sleep -Seconds 35
          Assert-Running $p "update check"
          # Minimize to tray: the minimize command should hide the window, not end the app.
          # (Needs a taskbar; the ARM runner sits on the Windows setup screen without one, and then PulseRAM
          # rightly minimizes normally.)
          if ([Win32.Msg]::FindWindow("Shell_TrayWnd", $null) -ne [IntPtr]::Zero) {
            $p.Refresh(); $hwnd = $p.MainWindowHandle
            [Win32.Msg]::PostMessage($hwnd, 0x0112, [IntPtr]0xF020, [IntPtr]::Zero) | Out-Null
            Start-Sleep -Seconds 3
            Assert-Running $p "minimize to tray"
            if ([Win32.Msg]::IsWindowVisible($hwnd)) { Write-Error "Minimize did not hide PulseRAM to the tray"; exit 1 }
            Write-Host "Minimize to tray: window hidden, app still running"
          } else {
            Write-Host "No taskbar on this runner; minimize-to-tray test skipped"
          }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          $log0 = Get-ChildItem (Join-Path $data "logs") -Filter "pulseram-*.log" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not (Select-String -Path $log0.FullName -Pattern "Theme switched" -Quiet)) { Write-Warning "No live theme switch was logged (Windows may not have broadcast the change)" }
          if (-not (Select-String -Path $log0.FullName -Pattern "Update (check|available)" -Quiet)) {
            Get-Content $log0.FullName -Tail 40
            Write-Error "The scheduled update check did not run"; exit 1
          }
          Select-String -Path $log0.FullName -Pattern "Update (check|available)|Theme switched" | ForEach-Object { $_.Line }

          # 3) Compact widget, with see-through on (the mouse is not over it, so it should fade).
          (Get-Content $cfg -Raw) -replace '"MiniHudSeeThrough":\s*false', '"MiniHudSeeThrough": true' | Set-Content $cfg -Encoding utf8
          $c = Start-Process -FilePath $exe -ArgumentList "--compact" -PassThru
          Start-Sleep -Seconds 15
          Assert-Running $c "compact view"
          Save-Screen "screenshots\compact.png"
          Stop-Process -Id $c.Id -Force

          $log = Get-ChildItem (Join-Path $data "logs") -Filter "pulseram-*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $log) { Write-Error "PulseRAM did not write a log"; exit 1 }
          Get-Content $log.FullName -TotalCount 40
          if (Select-String -Path $log.FullName -Pattern " ERROR " -Quiet) { Write-Error "Errors were logged"; exit 1 }

          $t = Start-Process -FilePath $exe -ArgumentList "--thaw-frozen" -PassThru -Wait
          Write-Host "--thaw-frozen exit code: $($t.ExitCode)"

      - name: Upload app files for signing
        id: unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: |
            ${{ env.PUBLISH }}/PulseRAM.exe
            ${{ env.PUBLISH }}/PulseRAM.dll

      - name: Sign app files (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulseRAM' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Use signed app files
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-app\* $env:PUBLISH -Force
          Get-AuthenticodeSignature "$env:PUBLISH\PulseRAM.exe" | Format-List Status, SignerCertificate

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc "/DMyArch=${{ matrix.arch }}" "/DPublishDir=$env:PUBLISH" PulseRAM.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\PulseRAM-Setup-v${{ steps.ver.outputs.version }}${{ matrix.suffix }}.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not produced"; exit 1 }

          $portable = "portable_${{ matrix.arch }}"
          Copy-Item $env:PUBLISH $portable -Recurse
          Copy-Item portable.txt $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "dist\PulseRAM-Portable-v${{ steps.ver.outputs.version }}-${{ matrix.arch }}.zip" -CompressionLevel Optimal
          Get-ChildItem dist | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }

      - name: Upload installer for signing
        id: unsigned-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: dist/PulseRAM-Setup-v${{ steps.ver.outputs.version }}${{ matrix.suffix }}.exe

      - name: Sign installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulseRAM' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed-installer\*.exe dist -Force

      - name: Test portable version
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pulseram-portable"
          Expand-Archive "dist\PulseRAM-Portable-v${{ steps.ver.outputs.version }}-${{ matrix.arch }}.zip" -DestinationPath $dir -Force
          $p = Start-Process -FilePath (Join-Path $dir "PulseRAM.exe") -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { Write-Error "Portable PulseRAM exited during startup (exit code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          $cfg = Join-Path $dir "data\pulseram_config.json"
          if (-not (Test-Path $cfg)) { Write-Error "Portable mode did not keep its settings next to the EXE ($cfg)"; exit 1 }
          Write-Host "Portable settings: $cfg"

      - name: Test installer (silent install, launch, uninstall)
        shell: pwsh
        run: |
          $exe = "dist\PulseRAM-Setup-v${{ steps.ver.outputs.version }}${{ matrix.suffix }}.exe"
          $inst = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -PassThru -Wait
          if ($inst.ExitCode -ne 0) { Write-Error "Installer exit code $($inst.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\PulseRAM\PulseRAM.exe"
          if (-not (Test-Path $app)) { Write-Error "Installed EXE not found at $app"; exit 1 }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { Write-Error "Installed PulseRAM exited during startup"; exit 1 }
          Write-Host "Installed build runs."
          $unins = Join-Path $env:LOCALAPPDATA "Programs\PulseRAM\unins000.exe"
          $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Write-Host "Uninstaller exit code: $($u.ExitCode)"
          Start-Sleep -Seconds 3
          if (Get-Process -Name PulseRAM -ErrorAction SilentlyContinue) { Write-Error "PulseRAM still running after uninstall"; exit 1 }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Out-File -Encoding ascii "dist\SHA256SUMS-${{ matrix.arch }}.txt"
          Get-Content "dist\SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.arch }}
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: PulseRAM-v${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
